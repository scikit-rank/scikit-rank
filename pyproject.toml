[project]
name = "scikit-rank"
version = "1.0.0"
description = "Scikit-learn-Compatible Neural Ranking Models for Tabular Recommender Systems"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.14.0",
    "einops>=0.8.2",
    "muon-optimizer>=0.1.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "polars>=1.41.2",
    "pyarrow>=19.0.0",
    "pytorch-ignite>=0.5.4",
    "schedulefree>=1.4.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tabm==0.0.3",
    "torch>=2.12.0",
    "tqdm>=4.68.2",
]

[dependency-groups]
dev = [
    "clearml>=1.16.0",
    "ipython>=9.14.0",
    "jupyterlab>=4.6.1",
    "matplotlib>=3.11.0",
    "pytest>=9.0.0",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
]
lgbm = [
    "lightgbm>=4.0.0",
]
xgboost = [
    "xgboost>=2.1.0",
]
catboost = [
    "catboost>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scikit_rank"]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "ARG002",
    "B008",
    "B020",
    "CPY001",
    "D1",
    "EM",
    "FA",
    "FBT001",
    "FBT002",
    "FIX",
    "N802",
    "N803",
    "N806",
    "N812",
    "PGH003",
    "PLR1704",
    "PLR2004",
    "PLW2901",
    "S101",
    "TD",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"exps/scripts/**" = ["INP001"]
"exps/scripts/train_temporal_tabular.py" = ["INP001", "PLC0415"]
"tests/**" = [
    "S101",
    "ANN",
    "D",
    "INP001",
    "SLF001",
    "ARG",
    "S311",
    "PLR0913",
    "RUF001",
    "RUF002",
    "RUF003",
    "ERA001",
    "DTZ",
    "FBT",
]

[tool.ruff.lint.isort]
no-lines-before = ["standard-library", "local-folder"]
known-third-party = []
known-local-folder = ["scikit_rank"]

[tool.ruff.lint.pylint]
max-args = 40
max-statements = 100
max-branches = 20

[tool.ruff.lint.mccabe]
max-complexity = 15
